  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      var nodeData = {
        n1: { index: 1, time: &#x27;09:18&#x27;, type: &#x27;用户消息&#x27;, text: &#x27;“先定义出当前的完美形态，然后再切割版本逐个开发。”&#x27;, before: 0, after: 30, original: &#x27;先定义出当前的完美形态，然后再切割版本逐个开发。&#x27; },

        n3: { index: 3, time: &#x27;10:08&#x27;, type: &#x27;用户消息&#x27;, text: &#x27;“我期望加上 pi-intercom 和 pi-messenger……”&#x27;, before: 18, after: 12, original: &#x27;我期望加上 pi-intercom 和 pi-messenger；需要结合当前启用扩展反推功能。&#x27; },
        n4: { index: 4, time: &#x27;10:26&#x27;, type: &#x27;智能体回复&#x27;, text: &#x27;“Intercom 负责持久 Session 间定向通信……”&#x27;, before: 22, after: 8, original: &#x27;&#x27; },
        n5: { index: 5, time: &#x27;10:58&#x27;, type: &#x27;用户消息&#x27;, text: &#x27;“Messenger 可以参考 Agent 团队……”&#x27;, before: 26, after: 4, original: &#x27;Messenger 可以参考 Agent 团队：他们彼此通信，我能集中看到分别做了什么、说了什么。&#x27; },
        n6: { index: 6, time: &#x27;11:21&#x27;, type: &#x27;智能体回复&#x27;, text: &#x27;“智能体团队已收进当前会话……”&#x27;, before: 30, after: 0, original: &#x27;&#x27; }
      };
      var agentData = {
        &#x27;产品结构&#x27;: {
          role: &#x27;负责对象层级与日常工作流&#x27;,
          summary: &#x27;确认项目是 D Code 的组织对象，可包含多个唯一归属的源文件夹；Pi 会话与 cwd 仍保持原义。&#x27;,
          events: [[&#x27;11:07&#x27;, &#x27;向界面评审询问右栏信息密度。&#x27;], [&#x27;11:14&#x27;, &#x27;收到“对话优先、谱系二级”的反馈。&#x27;], [&#x27;11:18&#x27;, &#x27;提交结构结论给协调智能体。&#x27;]]
        },
        &#x27;Pi 语义&#x27;: {
          role: &#x27;核对会话、路径与复制的真实边界&#x27;,
          summary: &#x27;确认会话内回溯与独立新会话是两种不同操作，项目文件都保持当前状态。&#x27;,
          events: [[&#x27;10:42&#x27;, &#x27;核对 navigateTree 的同会话语义。&#x27;], [&#x27;10:49&#x27;, &#x27;确认 fork 与 clone 创建独立会话。&#x27;], [&#x27;11:02&#x27;, &#x27;把边界发送给产品结构。&#x27;]]
        },

          role: &#x27;盘点现有 Pi 扩展与原生化入口&#x27;,
          summary: &#x27;确认扩展继续在 Pi 运行时执行；原生界面消费结构化状态、消息和产物。&#x27;,
          events: [[&#x27;10:36&#x27;, &#x27;完成启用扩展清单。&#x27;], [&#x27;10:51&#x27;, &#x27;标记 Intercom 与 Messenger 接缝。&#x27;], [&#x27;11:05&#x27;, &#x27;提交原生整合优先级。&#x27;]]
        },
        &#x27;界面评审&#x27;: {
          role: &#x27;验证三栏层级与信息密度&#x27;,
          summary: &#x27;建议左栏常驻、右栏按宽度自适应，并把会话信息与项目信息分成两个作用域。&#x27;,
          events: [[&#x27;11:08&#x27;, &#x27;评估 Codex 式消息快捷操作。&#x27;], [&#x27;11:15&#x27;, &#x27;提出会话 / 项目双作用域。&#x27;], [&#x27;11:20&#x27;, &#x27;确认文件树进入项目作用域。&#x27;]]
        }
      };

      function showToast(message) {
        var toast = root.querySelector(&#x27;.sl-toast&#x27;);
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.hidden = false;
        toastTimer = window.setTimeout(function () { toast.hidden = true; }, 2300);
      }

      function updatePanelButtons(side, visible) {
        root.querySelectorAll(&#x27;[data-action=&quot;toggle-&#x27; + side + &#x27;&quot;]&#x27;).forEach(function (button) {
          button.setAttribute(&#x27;aria-expanded&#x27;, visible ? &#x27;true&#x27; : &#x27;false&#x27;);
        });
      }

      function setPanel(side, visible, rememberPreference) {
        if (rememberPreference) panelPreference[side] = visible;
        root.classList.toggle(&#x27;sl-&#x27; + side + &#x27;-hidden&#x27;, !visible);
        updatePanelButtons(side, visible);
      }

      function closeNarrowPanels() {
        if (compactQuery.matches) {
          setPanel(&#x27;left&#x27;, false, false);
          setPanel(&#x27;right&#x27;, false, false);
        } else if (inspectorOverlayQuery.matches) {
          setPanel(&#x27;right&#x27;, false, false);
        }
      }

      function applyResponsiveState() {
        if (compactQuery.matches) {
          setPanel(&#x27;left&#x27;, false, false);
          setPanel(&#x27;right&#x27;, false, false);
        } else if (inspectorOverlayQuery.matches) {
          setPanel(&#x27;left&#x27;, panelPreference.left, false);
          setPanel(&#x27;right&#x27;, false, false);
        } else {
          setPanel(&#x27;left&#x27;, panelPreference.left, false);
          setPanel(&#x27;right&#x27;, panelPreference.right, false);
        }
      }

      function closeMenu() {
        var menu = root.querySelector(&#x27;.sl-session-menu&#x27;);
        menu.hidden = true;
        root.querySelector(&#x27;[data-action=&quot;session-menu&quot;]&#x27;).setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
      }

      function showInspectorTab(tab, scope) {
        var activeScope = scope || inspectorState.scope;
        inspectorState.scope = activeScope;
        inspectorState[activeScope] = tab;
        root.querySelectorAll(&#x27;[data-inspector-scope]&#x27;).forEach(function (button) {
          button.setAttribute(&#x27;aria-selected&#x27;, button.getAttribute(&#x27;data-inspector-scope&#x27;) === activeScope ? &#x27;true&#x27; : &#x27;false&#x27;);
        });
        root.querySelectorAll(&#x27;[data-scope-tabs]&#x27;).forEach(function (group) {
          group.hidden = group.getAttribute(&#x27;data-scope-tabs&#x27;) !== activeScope;
        });
        root.querySelectorAll(&#x27;[data-inspector-tab]&#x27;).forEach(function (button) {
          var sameScope = button.closest(&#x27;[data-scope-tabs]&#x27;).getAttribute(&#x27;data-scope-tabs&#x27;) === activeScope;
          button.setAttribute(&#x27;aria-selected&#x27;, sameScope &amp;&amp; button.getAttribute(&#x27;data-inspector-tab&#x27;) === tab ? &#x27;true&#x27; : &#x27;false&#x27;);
        });
        root.querySelectorAll(&#x27;[data-inspector-panel]&#x27;).forEach(function (panel) {
          panel.hidden = panel.getAttribute(&#x27;data-inspector-panel&#x27;) !== tab;
        });
        var currentSessionTitle = root.querySelector(&#x27;.sl-session-heading h1&#x27;).textContent;
        var currentProjectName = root.dataset.currentProjectName || &#x27;D Code&#x27;;
        root.querySelectorAll(&#x27;[data-project-select]&#x27;).forEach(function (projectButton) {
          var isCurrentProject = (projectButton.dataset.projectName || projectButton.querySelector(&#x27;strong&#x27;).textContent) === currentProjectName;
          projectButton.setAttribute(&#x27;aria-pressed&#x27;, activeScope === &#x27;Project&#x27; &amp;&amp; isCurrentProject ? &#x27;true&#x27; : &#x27;false&#x27;);
        });
        root.querySelector(&#x27;#sl-inspector-subtitle&#x27;).textContent = activeScope === &#x27;Session&#x27; ? &#x27;当前会话 · &#x27; + currentSessionTitle : &#x27;当前项目 · &#x27; + currentProjectName + &#x27; · 2 个源文件夹&#x27;;
      }

      function showInspectorScope(scope) {
        showInspectorTab(inspectorState[scope], scope);
      }

      function selectProject(button) {
        root.dataset.currentProjectName = button.dataset.projectName || button.querySelector(&#x27;strong&#x27;).textContent;
        root.querySelectorAll(&#x27;[data-project-select]&#x27;).forEach(function (projectButton) {
          projectButton.setAttribute(&#x27;aria-pressed&#x27;, projectButton === button ? &#x27;true&#x27; : &#x27;false&#x27;);
        });
        showInspectorTab(&#x27;文件&#x27;, &#x27;Project&#x27;);
        setPanel(&#x27;right&#x27;, true, false);
        if (compactQuery.matches) setPanel(&#x27;left&#x27;, false, false);
      }

      function selectAgent(name) {
        var data = agentData[name];
        if (!data) return;
        root.querySelectorAll(&#x27;[data-agent]&#x27;).forEach(function (button) {
          button.classList.toggle(&#x27;is-selected&#x27;, button.getAttribute(&#x27;data-agent&#x27;) === name);
        });
        root.querySelector(&#x27;#sl-agent-name&#x27;).textContent = name;
        root.querySelector(&#x27;#sl-agent-role&#x27;).textContent = data.role;
        root.querySelector(&#x27;#sl-agent-status&#x27;).textContent = &#x27;已汇总&#x27;;
        root.querySelector(&#x27;#sl-agent-summary&#x27;).textContent = data.summary;
        var events = root.querySelector(&#x27;#sl-agent-events&#x27;);
        events.replaceChildren();
        data.events.forEach(function (entry) {
          var row = document.createElement(&#x27;div&#x27;);
          row.className = &#x27;sl-agent-event&#x27;;
          var time = document.createElement(&#x27;time&#x27;);
          time.textContent = entry[0];
          var message = document.createElement(&#x27;span&#x27;);
          message.textContent = entry[1];
          row.append(time, message);
          events.appendChild(row);
        });
      }

      function toggleFileGroup(button, expanded) {
        var group = root.querySelector(&#x27;#&#x27; + button.getAttribute(&#x27;data-file-toggle&#x27;));
        if (!group) return;
        var next = typeof expanded === &#x27;boolean&#x27; ? expanded : button.getAttribute(&#x27;aria-expanded&#x27;) !== &#x27;true&#x27;;
        button.setAttribute(&#x27;aria-expanded&#x27;, next ? &#x27;true&#x27; : &#x27;false&#x27;);
        group.hidden = !next;
      }

      function selectFile(button) {
        root.querySelectorAll(&#x27;[data-file-path]&#x27;).forEach(function (item) {
          item.classList.toggle(&#x27;is-selected&#x27;, item === button);
        });
        var path = button.getAttribute(&#x27;data-file-path&#x27;);
        root.querySelector(&#x27;#sl-file-selected&#x27;).textContent = path;
        root.querySelector(&#x27;#sl-file-state&#x27;).textContent = button.querySelector(&#x27;em&#x27;) ? &#x27;已修改 · 尚未加入当前上下文&#x27; : &#x27;未修改 · 尚未加入当前上下文&#x27;;
      }

      function setHistoryMode(enabled) {
        root.classList.toggle(&#x27;sl-conversation-mode&#x27;, !enabled);
        if (enabled) root.classList.remove(&#x27;sl-rewrite-mode&#x27;);

        closeMenu();
      }

      function selectNode(nodeId) {
        if (!nodeData[nodeId]) return;
        selectedNode = nodeId;
        var data = nodeData[nodeId];
        root.querySelectorAll(&#x27;.sl-turn&#x27;).forEach(function (turn) {
          var index = Number(turn.getAttribute(&#x27;data-index&#x27;));
          var selected = turn.getAttribute(&#x27;data-node&#x27;) === nodeId;
          turn.classList.toggle(&#x27;is-selected&#x27;, selected);
          turn.classList.toggle(&#x27;is-after&#x27;, index &gt; data.index);
          var state = turn.querySelector(&#x27;.sl-turn-state&#x27;);
          if (selected) {
            if (!state) {
              state = document.createElement(&#x27;span&#x27;);
              state.className = &#x27;sl-turn-state&#x27;;
              turn.querySelector(&#x27;.sl-turn-head&#x27;).appendChild(state);
            }
            state.textContent = &#x27;所选节点&#x27;;
          } else if (index &gt; data.index) {
            if (!state) {
              state = document.createElement(&#x27;span&#x27;);
              state.className = &#x27;sl-turn-state&#x27;;
              turn.querySelector(&#x27;.sl-turn-head&#x27;).appendChild(state);
            }
            state.textContent = &#x27;不会带入&#x27;;
          } else if (state) {
            state.remove();
          }
        });

        root.querySelector(&#x27;#sl-node-title&#x27;).textContent = data.time + &#x27; · &#x27; + data.type;
        root.querySelector(&#x27;#sl-node-text&#x27;).textContent = data.text;
        root.querySelector(&#x27;#sl-before-count&#x27;).textContent = data.before + &#x27; 条&#x27;;
        root.querySelector(&#x27;#sl-after-count&#x27;).textContent = data.after + &#x27; 条&#x27;;
        root.querySelector(&#x27;#sl-included-history&#x27;).textContent = (data.type === &#x27;用户消息&#x27; ? &#x27;所选消息之前的 &#x27; : &#x27;到这条回复为止的 &#x27;) + data.before + &#x27; 条会话记录&#x27;;
        root.querySelector(&#x27;#sl-excluded-history&#x27;).textContent = &#x27;所选节点之后的 &#x27; + data.after + &#x27; 条会话记录&#x27;;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);

      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {

    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,

              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }

    const trigger = getTrigger(event.target);

    }

    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);

  };

  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
