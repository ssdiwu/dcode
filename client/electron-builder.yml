appId: dev.dcode.desktop
productName: D Code
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../host/dist
    to: host-dist
  - from: ../host/package.json
    to: host-package.json
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dir
    - target: dmg
  identity: null
